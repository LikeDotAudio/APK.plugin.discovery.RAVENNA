# RAVENNA / AES67 audio stream discovery configuration
# Published to MQTT (retained) by apk-plugin-runner at: APK.audio/System/Protocols/ravenna/config
#
# DISCOVERY + DESCRIPTION ONLY. Browses mDNS for stream announcements and
# fetches each stream's SDP via RTSP DESCRIBE. No RTP receive, no subscription,
# no connection management — reading an SDP changes nothing on the device.
[ravenna]
enabled = true
# No service_type/domain keys: the agent browses SERVICE_TYPES in src/lib.rs
# (`_ravenna._tcp` and `_rtsp._tcp`, on `local.`); the keys were read by no
# code and are removed (LOOSE-config).

# TIMING (RP-14) — read by Settings::from_ini (src/lib.rs), whole seconds above
# zero; a missing or wrong key stops the agent with its name, never guessed.
# restate_s: how often every known stream's fields are said again. Nothing is
#   retained, so between mDNS events this is the only reason a stream is on the
#   bus. Restated from values in hand: no SDP is re-fetched to do it.
# rtsp_timeout_s: how long one RTSP DESCRIBE may take to connect, write or read
#   before the session is skipped as "no SDP".
restate_s = 30
rtsp_timeout_s = 4

# NOTE: no topic/topic_listen/topic_publish/topic_ignore keys here.
# This agent takes its broker address as a parameter and owns its topic in
# code; a declared triple that nothing reads is dead config, which the
# validator flags. Only add these keys if the agent actually reads them.

# PRESENCE (PLAN-3318.01) — read by apk-plugin-runner::presence::settings_from_config.
# One retained status document per device at APK.audio/Discovery/ravenna/{deviceId}:
# lastOnline / lastOffline / lastDiscovered, written on a transition only.
# mDNS: mdns-sd says a device again only when its record CHANGES, and says it
# left on a goodbye or a lapsed TTL (ServiceRemoved). A steady device is never
# re-sighted, so there is no clock here — 0 is departures only.
presence_protocols = ravenna
presence_inactive_after_s = 0

# DEVICE PANELS (PLAN-3413.01) — read by apk-plugin-runner::panels::expire_after_from_config.
# A device's panel at APK.audio/System/Gui/Panels/<key> is emptied when it has
# said nothing for this many seconds. Nothing here is retained and the agent
# restates every known device every restate_s (30 s), so 120 is four missed restates.
panels_expire_after_s = 120
